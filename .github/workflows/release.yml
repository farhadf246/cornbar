name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(npm pkg get version | tr -d '"')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14. Do not set NODE_AUTH_TOKEN here.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -vxF "$TAG" | head -n1 || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_NOTES="$(git log --pretty=format:'- %s (%h)' "${PREVIOUS_TAG}..${TAG}")"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${TAG}"
            NOTES="$(printf '## Changes\n\n%s\n\n**Full Changelog**: %s\n' "$COMMIT_NOTES" "$COMPARE_URL")"
          else
            COMMIT_NOTES="$(git log --pretty=format:'- %s (%h)' "$TAG")"
            NOTES="$(printf '## Changes\n\n%s\n' "$COMMIT_NOTES")"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            EXTRA_FLAGS=()
            if [[ "$TAG" == *-* ]]; then
              EXTRA_FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" --verify-tag "${EXTRA_FLAGS[@]}"
          fi
